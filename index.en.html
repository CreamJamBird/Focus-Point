<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Focal Point</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: reading stage + minimap column on the right (below on phones), controls under the stage, text source at the bottom */
:root {
  --bg: #eef0ec;
  --surface: #f8f9f6;
  --line: #d3d8d0;
  --fg: #1b2230;
  --muted: #687080;
  --faint: #a3aab3;
  --pivot: #cf3326;
  --accent: #23466e;
  --hl: #23466e1f;
  --f-word: "Literata", "PT Serif", Georgia, serif;
  --f-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --surface: #1a1e26; --line: #2c323d; --fg: #e3e6ea; --muted: #9098a6;
    --faint: #5b6370; --pivot: #ff6656; --accent: #8fb3e0; --hl: #8fb3e026; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --surface: #1a1e26; --line: #2c323d; --fg: #e3e6ea; --muted: #9098a6;
  --faint: #5b6370; --pivot: #ff6656; --accent: #8fb3e0; --hl: #8fb3e026; color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--f-word); font-weight: 600; font-size: 22px; margin: 0; letter-spacing: -0.01em; }
h1 b { color: var(--pivot); font-weight: 600; }
.hint { color: var(--muted); font-size: 12px; }
kbd { font-family: var(--f-num); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; background: var(--surface); }

.app {
  display: grid; gap: 16px;
  grid-template-columns: minmax(0, 1fr) 300px;
  grid-template-areas: "stage map" "controls map";
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "stage" "map" "controls"; }
}

/* Stage */
.stage {
  grid-area: stage; position: relative; background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; height: 230px; overflow: hidden; cursor: pointer; user-select: none;
  --fs: clamp(30px, 6.4vw, 54px);
}
.guide { position: absolute; left: 24px; right: 24px; height: 1px; background: var(--line); }
.guide.top { top: calc(50% - 0.95 * var(--fs)); }
.guide.bot { bottom: calc(50% - 0.95 * var(--fs)); }
.notch { position: absolute; width: 1px; height: 12px; background: var(--faint); left: calc(40% + 0.28 * var(--fs)); }
.guide.top .notch { top: 0; }
.guide.bot .notch { bottom: 0; }
.word {
  position: absolute; inset: 0; display: flex; align-items: center; white-space: pre;
  font-family: var(--f-word); font-size: calc(var(--fs) * var(--k, 1)); font-weight: 500; line-height: 1;
  font-variant-ligatures: none;
}
.w-l { width: 40%; text-align: right; }
.w-p { color: var(--pivot); }
.w-r { flex: 1; text-align: left; overflow: hidden; }
.stage-meta {
  position: absolute; left: 16px; right: 16px; bottom: 12px; display: flex; justify-content: space-between;
  font-family: var(--f-num); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums;
}
.paused-tag { color: var(--accent); }
.stage:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Minimap */
.map {
  grid-area: map; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  display: flex; flex-direction: column; min-width: 0; overflow: hidden;
}
.map-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px 6px; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; }
.map-scroll {
  position: relative; flex: 1; min-height: 0; height: 100%; overflow-y: auto; padding: 0 12px;
  font-family: var(--f-word); font-size: 12.5px; line-height: 1.6; color: var(--muted);
  -webkit-mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent);
  mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent);
  transition: opacity .3s;
  scrollbar-width: none;
}
.map-scroll::-webkit-scrollbar { display: none; }
@media (min-width: 761px) { .map { height: 100%; max-height: 380px; } }
@media (max-width: 760px) { .map-scroll { height: 150px; flex: none; } }
.map.dim .map-scroll { opacity: 0.35; }
.map-scroll p { margin: 0 0 0.7em; }
.map-scroll .pad { height: 45%; }
.map-scroll span { cursor: pointer; border-radius: 3px; }
.map-scroll span:hover { color: var(--fg); background: var(--hl); }
.map-scroll span.sent { color: var(--fg); }
.map-scroll span.cur { color: var(--surface); background: var(--pivot); }

/* Controls */
.controls {
  grid-area: controls; display: flex; flex-direction: column; gap: 14px;
}
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.btn {
  font: inherit; font-weight: 500; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; height: 40px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
}
.btn:hover { border-color: var(--faint); }
.btn:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.icon { width: 40px; padding: 0; justify-content: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); width: 56px; }
.btn svg { width: 18px; height: 18px; fill: currentColor; }
.speed { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 220px; }
.speed output { font-family: var(--f-num); font-size: 15px; font-weight: 500; min-width: 4.5ch; text-align: right; font-variant-numeric: tabular-nums; }
.speed small { color: var(--muted); font-size: 12px; white-space: nowrap; }
input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
.progress { display: flex; align-items: center; gap: 10px; }
.progress span { font-family: var(--f-num); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chap { display: flex; align-items: center; gap: 10px; }
.chap select {
  flex: 1; min-width: 0; max-width: 100%; height: 38px; font: inherit; color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0 10px;
}
.chap select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn[disabled] { opacity: .5; cursor: progress; }
.opts { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
.opts label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.opts input { accent-color: var(--accent); }

/* Source */
.source { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 18px; }
.source-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
textarea {
  width: 100%; min-height: 160px; resize: vertical; font-family: var(--f-word); font-size: 14px; line-height: 1.55;
  color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
}
.drop textarea { border-color: var(--accent); border-style: dashed; }
.file-in { position: absolute; width: 1px; height: 1px; opacity: 0; }
.status { font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .map-scroll { transition: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>F<b>o</b>cal Point</h1>
    <div class="hint"><kbd>Space</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> sentence · <kbd>↑</kbd><kbd>↓</kbd> speed</div>
  </header>

  <div class="app">
    <div class="stage" id="stage" tabindex="0" role="button" aria-label="Play or pause">
      <div class="guide top"><div class="notch"></div></div>
      <div class="word" id="word" aria-live="off"><span class="w-l"></span><span class="w-p"></span><span class="w-r"></span></div>
      <div class="guide bot"><div class="notch"></div></div>
      <div class="stage-meta"><span id="metaL"></span><span id="metaR"></span></div>
    </div>

    <aside class="map" id="map">
      <div class="map-head"><span class="label">Context</span><span class="status">tap a word to jump</span></div>
      <div class="map-scroll" id="mapScroll"></div>
    </aside>

    <div class="controls">
      <div class="row">
        <button class="btn icon" id="back" title="Previous sentence" aria-label="Previous sentence"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="btn primary" id="play" aria-label="Play"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4v16l13-8z"/></svg></button>
        <button class="btn icon" id="fwd" title="Next sentence" aria-label="Next sentence"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
        <div class="speed">
          <input type="range" id="wpm" min="100" max="1200" step="25" value="300" aria-label="Speed">
          <output id="wpmOut">300</output><small>wpm</small>
        </div>
      </div>
      <div class="progress">
        <input type="range" id="pos" min="0" max="0" value="0" aria-label="Position in text">
        <span id="posOut">0 / 0</span>
      </div>
      <div class="chap" id="chapRow" hidden>
        <label class="label" for="chap">Chapter</label>
        <select id="chap"></select>
      </div>
      <div class="opts">
        <label><input type="checkbox" id="optRamp" checked> Gradual warm-up</label>
        <label><input type="checkbox" id="optPause" checked> Smart pauses</label>
        <label><input type="checkbox" id="optDim" checked> Dim minimap while reading</label>
      </div>
    </div>
  </div>

  <section class="source" id="source">
    <div class="source-head">
      <span class="label">Text to read</span>
      <div class="row">
        <label class="btn" for="file">Open file</label>
        <input type="file" id="file" class="file-in" accept=".txt,.pdf,.epub,text/plain,application/pdf,application/epub+zip">
        <button class="btn" id="load">Read this text</button>
      </div>
    </div>
    <textarea id="text" spellcheck="false" placeholder="Paste text here or drop a TXT, PDF or EPUB file"></textarea>
    <span class="status" id="srcStatus">A sample text is loaded. Paste your own text or open a TXT, PDF or EPUB file.</span>
  </section>
</div>

<script>
const SAMPLE = `Sample text. Replace it with your own.

Ordinary reading is wasteful. Your eyes do not glide smoothly along a line. They jump from word to word in short hops. Every hop takes time, and at the end of each line your gaze has to travel back to the start of the next one. Part of your reading time goes not into understanding, but into finding where to look next.

Rapid serial visual presentation removes those jumps. Words appear one at a time in the same spot on the screen, so your eyes no longer have to move. One letter in each word is highlighted. That is the optimal recognition point: the place your gaze lands naturally and where the word is recognized fastest. It usually sits slightly left of center.

Start at a comfortable speed, around three hundred words per minute. After a few days you can add fifty words at a time. If the meaning slips away, press pause: the panel on the right shows where you are, and tapping any word in the minimap takes you back to it.

Remember that speed is not the goal in itself. Light text can be read very fast, while dense text calls for slowing down. Smart pauses help: words linger longer at commas and at the ends of sentences, giving your brain time to put the whole phrase together.`;

const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
};
let chapters = [];
function splitParas(text) {
  return text.replace(/\r\n?/g, "\n").split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
}

let tokens = [], sentStart = [], idx = 0, playing = false, timer = null, rampCount = 0, wakeLock = null;
let winStart = 0, winEnd = 0, curSpan = null, lastTop = -1, sentSpans = [];

const LETTER = /[\p{L}\p{N}]/u;

function parse(text) {
  const paras = splitParas(text);
  const out = [];
  paras.forEach((p, pi) => {
    const ws = p.split(/\s+/).filter(Boolean);
    ws.forEach((w, wi) => {
      let end = 0;
      const core = w.replace(/[»"”’)\]]+$/u, "");
      if (/[.!?…]$/.test(core)) end = 2;
      else if (/[,;:—–-]$/.test(core) || w === "—" || w === "–") end = 1;
      if (wi === ws.length - 1) end = 3;
      out.push({ w, p: pi, end });
    });
  });
  return out;
}

function computeSentences() {
  sentStart = new Array(tokens.length);
  let s = 0;
  for (let i = 0; i < tokens.length; i++) {
    sentStart[i] = s;
    if (tokens[i].end >= 2) s = i + 1;
  }
}

function orpIndex(n) {
  if (n <= 1) return 0;
  if (n <= 5) return 1;
  if (n <= 9) return 2;
  if (n <= 13) return 3;
  return 4;
}

function showWord(i) {
  const el = $("word");
  const [l, p, r] = el.children;
  if (!tokens.length) { l.textContent = ""; p.textContent = ""; r.textContent = ""; return; }
  const w = tokens[i].w;
  const chars = Array.from(w);
  const letterPos = [];
  chars.forEach((c, k) => { if (LETTER.test(c)) letterPos.push(k); });
  let piv = letterPos.length ? letterPos[Math.min(orpIndex(letterPos.length), letterPos.length - 1)] : 0;
  l.textContent = chars.slice(0, piv).join("");
  p.textContent = chars[piv] || "";
  r.textContent = chars.slice(piv + 1).join("");
  el.style.setProperty("--k", chars.length > 13 ? Math.max(0.55, 13 / chars.length) : 1);
}

function wordDelay(i) {
  const target = +$("wpm").value;
  let wpm = target;
  if ($("optRamp").checked) wpm = target * (0.6 + 0.4 * Math.min(1, rampCount / 30));
  let ms = 60000 / wpm;
  if ($("optPause").checked) {
    const t = tokens[i];
    const len = Array.from(t.w).filter(c => LETTER.test(c)).length;
    let f = 1 + Math.max(0, len - 7) * 0.07;
    if (t.end === 1) f += 0.6;
    else if (t.end === 2) f += 1.2;
    else if (t.end === 3) f += 1.8;
    ms *= Math.min(f, 3.2);
  }
  return ms;
}

function tick() {
  if (!playing) return;
  setIndex(idx, true);
  const d = wordDelay(idx);
  rampCount++;
  timer = setTimeout(() => {
    if (idx >= tokens.length - 1) { stop(true); return; }
    idx++;
    tick();
  }, d);
}

async function play() {
  if (!tokens.length) return;
  if (idx >= tokens.length - 1) idx = 0;
  playing = true; rampCount = 0;
  $("playIcon").innerHTML = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
  $("play").setAttribute("aria-label", "Pause");
  updateDim();
  try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
  tick();
}

function stop(finished) {
  playing = false; clearTimeout(timer);
  $("playIcon").innerHTML = '<path d="M7 4v16l13-8z"/>';
  $("play").setAttribute("aria-label", "Play");
  updateDim();
  try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
  updateMeta(finished);
  store.set("rsvp-pos", idx);
}

function toggle() { playing ? stop() : play(); }

function updateDim() {
  $("map").classList.toggle("dim", playing && $("optDim").checked && +$("wpm").value >= 450);
}

function remainingMin() {
  let ms = 0;
  const target = +$("wpm").value;
  const per = 60000 / target;
  // rough estimate with pause factor
  const factor = $("optPause").checked ? 1.35 : 1;
  ms = (tokens.length - idx) * per * factor;
  return ms / 60000;
}

function updateMeta(finished) {
  const pct = tokens.length ? Math.round((idx + 1) / tokens.length * 100) : 0;
  $("metaL").innerHTML = finished ? '<span class="paused-tag">End of text</span>' : (playing ? `${$("wpm").value} wpm` : '<span class="paused-tag">Paused · tap to read</span>');
  const m = remainingMin();
  $("metaR").textContent = `${pct}% · ${m < 1 ? "<1" : Math.round(m)} min left`;
}

function setIndex(i, fromPlay) {
  idx = Math.max(0, Math.min(tokens.length - 1, i));
  showWord(idx);
  $("pos").value = idx;
  $("posOut").textContent = `${(idx + 1).toLocaleString("en")} / ${tokens.length.toLocaleString("en")}`;
  updateMap();
  updateMeta(false);
  updateChapter();
  if (!fromPlay || idx % 20 === 0) store.set("rsvp-pos", idx);
}

/* Chapters */
function renderChapters() {
  const sel = $("chap");
  sel.innerHTML = chapters.map((c, k) => `<option value="${k}">${c.title.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</option>`).join("");
  $("chapRow").hidden = chapters.length < 2;
}
function updateChapter() {
  if (chapters.length < 2) return;
  let k = 0;
  for (let j = 0; j < chapters.length; j++) { if (chapters[j].at <= idx) k = j; else break; }
  if ($("chap").value !== String(k)) $("chap").value = k;
}
$("chap").onchange = () => nav(() => { setIndex(chapters[+$("chap").value].at); $("stage").focus(); });

/* Minimap */
const WIN = 260;
function renderMap() {
  const ms = $("mapScroll");
  winStart = Math.max(0, idx - WIN);
  winEnd = Math.min(tokens.length, idx + WIN);
  let html = '<div class="pad"></div>';
  let curP = -1;
  for (let i = winStart; i < winEnd; i++) {
    const t = tokens[i];
    if (t.p !== curP) { if (curP !== -1) html += "</p>"; html += "<p>"; curP = t.p; }
    html += `<span data-i="${i}">${t.w.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</span> `;
  }
  if (curP !== -1) html += "</p>";
  html += '<div class="pad"></div>';
  ms.innerHTML = html;
  curSpan = null; sentSpans = []; lastTop = -1;
}

function updateMap() {
  if (!tokens.length) { $("mapScroll").innerHTML = ""; return; }
  const needs = idx < winStart + 40 && winStart > 0 || idx > winEnd - 40 && winEnd < tokens.length || idx < winStart || idx >= winEnd;
  if (needs || !$("mapScroll").firstChild) renderMap();
  const ms = $("mapScroll");
  const span = ms.querySelector(`span[data-i="${idx}"]`);
  if (curSpan) curSpan.classList.remove("cur");
  // sentence highlight
  const s = sentStart[idx];
  if (!sentSpans.length || +sentSpans[0].dataset.i !== s) {
    sentSpans.forEach(x => x.classList.remove("sent"));
    sentSpans = [];
    for (let i = Math.max(s, winStart); i < winEnd; i++) {
      if (i > s && sentStart[i] !== s) break;
      const sp = ms.querySelector(`span[data-i="${i}"]`);
      if (sp) { sp.classList.add("sent"); sentSpans.push(sp); }
    }
  }
  if (!span) return;
  span.classList.add("cur");
  curSpan = span;
  if (span.offsetTop !== lastTop) {
    lastTop = span.offsetTop;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    ms.scrollTo({ top: span.offsetTop - ms.clientHeight / 2 + span.offsetHeight / 2, behavior: reduce ? "auto" : "smooth" });
  }
}

$("mapScroll").addEventListener("click", e => {
  const sp = e.target.closest("span[data-i]");
  if (!sp) return;
  const wasPlaying = playing;
  if (playing) stop();
  setIndex(+sp.dataset.i);
  if (wasPlaying) play();
});

/* Navigation */
function back() {
  const s = sentStart[idx];
  let target = s;
  if (idx - s < 2 && s > 0) target = sentStart[s - 1];
  setIndex(target); rampCount = 0;
}
function fwd() {
  let i = idx + 1;
  while (i < tokens.length && sentStart[i] === sentStart[idx]) i++;
  setIndex(Math.min(i, tokens.length - 1)); rampCount = 0;
}
function jump(fn) {
  const was = playing;
  if (was) { clearTimeout(timer); }
  fn();
  if (was) { timer = setTimeout(() => { idx++; tick(); }, 0); idx--; }
}
// simpler: restart loop from new index
function nav(fn) {
  const was = playing;
  if (was) { playing = false; clearTimeout(timer); }
  fn();
  if (was) { playing = true; rampCount = 0; tick(); }
}

$("play").onclick = toggle;
$("stage").onclick = toggle;
$("back").onclick = () => nav(back);
$("fwd").onclick = () => nav(fwd);

$("wpm").oninput = () => {
  $("wpmOut").textContent = $("wpm").value;
  store.set("rsvp-wpm", $("wpm").value);
  updateDim(); updateMeta(false);
};
$("pos").oninput = () => nav(() => setIndex(+$("pos").value));
["optRamp", "optPause", "optDim"].forEach(id => $(id).onchange = () => { store.set("rsvp-" + id, $(id).checked ? "1" : "0"); updateDim(); });

document.addEventListener("keydown", e => {
  if (e.target.matches("textarea, input[type=text]")) return;
  if (e.code === "Space") { e.preventDefault(); toggle(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); nav(back); }
  else if (e.key === "ArrowRight") { e.preventDefault(); nav(fwd); }
  else if (e.key === "ArrowUp") { e.preventDefault(); $("wpm").value = +$("wpm").value + 25; $("wpm").oninput(); }
  else if (e.key === "ArrowDown") { e.preventDefault(); $("wpm").value = +$("wpm").value - 25; $("wpm").oninput(); }
});

/* Loading text */
function loadText(text, pos, chaps) {
  if (playing) stop();
  tokens = parse(text);
  computeSentences();
  chapters = [];
  (chaps || []).forEach(c => {
    let lo = 0, hi = tokens.length;
    while (lo < hi) { const m = (lo + hi) >> 1; if (tokens[m].p < c.para) lo = m + 1; else hi = m; }
    if (lo < tokens.length && (!chapters.length || chapters[chapters.length - 1].at < lo)) chapters.push({ title: c.title, at: lo });
  });
  renderChapters();
  $("pos").max = Math.max(0, tokens.length - 1);
  winStart = winEnd = 0;
  $("mapScroll").innerHTML = "";
  setIndex(pos || 0);
  updateMeta(false);
}

$("load").onclick = () => {
  const t = $("text").value;
  if (!t.trim()) { $("srcStatus").textContent = "The text is empty. Paste some text or open a file."; return; }
  store.set("rsvp-text", t);
  store.set("rsvp-chapters", "[]");
  store.set("rsvp-title", "");
  loadText(t, 0);
  $("srcStatus").textContent = `Loaded ${tokens.length.toLocaleString("en")} words. Tap the reading area to start.`;
  $("stage").scrollIntoView({ behavior: "smooth", block: "center" });
};

function decode(buf) {
  try { return new TextDecoder("utf-8", { fatal: true }).decode(buf); }
  catch (e) { return new TextDecoder("windows-1251").decode(buf); }
}
/* Libraries load only when a PDF or EPUB is opened */
const LIB = {
  pdf: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",
  pdfWorker: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js",
  zip: "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
};
const loaded = {};
function loadScript(src) {
  return loaded[src] || (loaded[src] = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = res;
    s.onerror = () => { delete loaded[src]; rej(fail("Could not load the file reader module. Check your internet connection and try again.")); };
    document.head.appendChild(s);
  }));
}
const say = t => { $("srcStatus").textContent = t; };
const fail = m => Object.assign(new Error(m), { friendly: true });
const clean = s => s.replace(/[\s ]+/g, " ").trim();

/* PDF */
async function pdfToBook(buf, name) {
  say("Loading PDF module…");
  await loadScript(LIB.pdfWorker);   // main-thread worker: the frame cannot start workers from a CDN
  await loadScript(LIB.pdf);
  pdfjsLib.GlobalWorkerOptions.workerSrc = LIB.pdfWorker;
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false, disableFontFace: true }).promise;
  const paras = [];
  let cur = "", lastLine = null;
  const pageStart = [];
  const SENT_END = /[.!?…:»"”)]$/;
  const pushPara = () => { const c = clean(cur); if (c) paras.push(c); cur = ""; };
  const join = (a, b) => {
    if (!a) return b;
    if (/[-­]$/.test(a) && /^[\p{Ll}]/u.test(b)) return a.replace(/[-­]$/, "") + b;
    return a + " " + b;
  };
  for (let p = 1; p <= pdf.numPages; p++) {
    if (p % 5 === 1) say(`Reading PDF: page ${p} of ${pdf.numPages}…`);
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const lines = [];
    let ln = null;
    for (const it of tc.items) {
      if (!("str" in it)) continue;
      const x = it.transform[4], y = it.transform[5], h = Math.abs(it.transform[3]) || it.height || 10;
      if (!ln || Math.abs(y - ln.y) > h * 0.5) { ln = { x, y, h, s: "", r: x }; lines.push(ln); }
      ln.s += it.str; ln.r = Math.max(ln.r, x + (it.width || 0));
      if (it.hasEOL) ln = null;
    }
    const L = lines.map(l => ({ ...l, s: clean(l.s) })).filter(l => l.s && !/^\d{1,4}$/.test(l.s));
    if (!L.length) { pageStart[p] = paras.length; continue; }
    const gaps = [];
    for (let i = 1; i < L.length; i++) { const g = L[i - 1].y - L[i].y; if (g > 0) gaps.push(g); }
    gaps.sort((a, b) => a - b);
    const med = gaps.length ? gaps[gaps.length >> 1] : L[0].h * 1.2;
    const xs = L.map(l => l.x).sort((a, b) => a - b);
    const left = xs[Math.floor(xs.length * 0.2)];
    const right = Math.max(...L.map(l => l.r));
    L.forEach((l, i) => {
      let brk;
      if (i === 0) {
        // across a page boundary, continue the paragraph unless the previous one clearly ended
        brk = !lastLine || SENT_END.test(lastLine.s) && (l.x - left > l.h * 0.8 || /^[\p{Lu}«"—–]/u.test(l.s));
      } else {
        const prev = L[i - 1], g = prev.y - l.y;
        brk = g < 0 || g > med * 1.45 ||
          (SENT_END.test(prev.s) && (l.x - left > l.h * 0.8 || prev.r < right - l.h * 3));
      }
      if (brk) pushPara();
      if (i === 0) pageStart[p] = paras.length;
      cur = join(cur, l.s);
      lastLine = l;
    });
  }
  pushPara();
  if (paras.join(" ").length < 40 * Math.min(pdf.numPages, 5)) {
    throw fail("This PDF has almost no text. It looks like scanned pages, which need text recognition (OCR) that is not supported yet.");
  }
  let title = name.replace(/\.pdf$/i, "");
  try { const m = await pdf.getMetadata(); if (m.info && m.info.Title && m.info.Title.trim()) title = m.info.Title.trim(); } catch (e) {}
  const chaps = [];
  try {
    const outline = await pdf.getOutline();
    const walk = async (items, depth) => {
      for (const it of items || []) {
        try {
          const dest = typeof it.dest === "string" ? await pdf.getDestination(it.dest) : it.dest;
          if (dest && dest[0] != null) {
            const pi = typeof dest[0] === "number" ? dest[0] : await pdf.getPageIndex(dest[0]);
            const para = pageStart[pi + 1];
            if (para != null) chaps.push({ title: clean(it.title) || `Section ${chaps.length + 1}`, para });
          }
        } catch (e) {}
        if (depth < 1) await walk(it.items, depth + 1);
      }
    };
    await walk(outline, 0);
  } catch (e) {}
  chaps.sort((a, b) => a.para - b.para);
  return { title, paras, chaps };
}

/* EPUB */
const BLOCK = new Set("p div h1 h2 h3 h4 h5 h6 li blockquote section article header footer aside tr dd dt pre figcaption table ul ol hr".split(" "));
function htmlToParas(str) {
  let doc = new DOMParser().parseFromString(str, "application/xhtml+xml");
  if (doc.getElementsByTagName("parsererror").length) doc = new DOMParser().parseFromString(str, "text/html");
  const body = doc.body || doc.getElementsByTagNameNS("*", "body")[0];
  if (!body) return { paras: [], heading: "" };
  let out = "";
  const walk = n => {
    if (n.nodeType === 3) { out += n.nodeValue.replace(/\s+/g, " "); return; }
    if (n.nodeType !== 1) return;
    const tag = n.localName.toLowerCase();
    if (tag === "script" || tag === "style") return;
    if (tag === "br") { out += " "; return; }
    const b = BLOCK.has(tag);
    if (b) out += "\n\n";
    n.childNodes.forEach(walk);
    if (b) out += "\n\n";
  };
  walk(body);
  const h = body.querySelector ? body.querySelector("h1, h2, h3") : null;
  return { paras: splitParas(out).map(clean).filter(Boolean), heading: h ? clean(h.textContent) : "" };
}
async function epubToBook(buf, name) {
  say("Loading EPUB module…");
  await loadScript(LIB.zip);
  const zip = await JSZip.loadAsync(buf);
  const read = async p => {
    const f = zip.file(p) || zip.file(decodeURIComponent(p));
    return f ? f.async("string") : null;
  };
  const xml = s => new DOMParser().parseFromString(s, "application/xml");
  const resolve = (base, href) => decodeURIComponent(new URL(href, "http://e/" + base).pathname.slice(1));
  const dir = p => p.includes("/") ? p.slice(0, p.lastIndexOf("/") + 1) : "";
  const byTag = (d, t) => Array.from(d.getElementsByTagNameNS("*", t));

  const container = await read("META-INF/container.xml");
  if (!container) throw fail("This does not look like an EPUB: the book description is missing.");
  const opfPath = byTag(xml(container), "rootfile")[0].getAttribute("full-path");
  const opf = xml(await read(opfPath));
  const base = dir(opfPath);
  const titleEl = byTag(opf, "title")[0];
  const title = titleEl ? clean(titleEl.textContent) : name.replace(/\.epub$/i, "");
  const manifest = {};
  byTag(opf, "item").forEach(it => {
    manifest[it.getAttribute("id")] = { path: resolve(base, it.getAttribute("href")), type: it.getAttribute("media-type") || "", props: it.getAttribute("properties") || "" };
  });

  // table of contents: EPUB 3 nav, then EPUB 2 NCX
  const toc = new Map();
  const navItem = Object.values(manifest).find(m => /\bnav\b/.test(m.props));
  if (navItem) {
    const s = await read(navItem.path);
    if (s) {
      const d = new DOMParser().parseFromString(s, "text/html");
      const nav = Array.from(d.querySelectorAll("nav")).find(n => /toc/.test(n.getAttribute("epub:type") || n.getAttribute("type") || "")) || d.querySelector("nav");
      if (nav) nav.querySelectorAll("a[href]").forEach(a => {
        const p = resolve(dir(navItem.path), a.getAttribute("href").split("#")[0]);
        if (!toc.has(p) && clean(a.textContent)) toc.set(p, clean(a.textContent));
      });
    }
  }
  if (!toc.size) {
    const spineEl = byTag(opf, "spine")[0];
    const ncxId = spineEl && spineEl.getAttribute("toc");
    const ncxItem = (ncxId && manifest[ncxId]) || Object.values(manifest).find(m => /ncx/.test(m.type));
    const s = ncxItem && await read(ncxItem.path);
    if (s) byTag(xml(s), "navPoint").forEach(np => {
      const label = byTag(np, "text")[0], content = byTag(np, "content")[0];
      if (!label || !content) return;
      const p = resolve(dir(ncxItem.path), content.getAttribute("src").split("#")[0]);
      if (!toc.has(p) && clean(label.textContent)) toc.set(p, clean(label.textContent));
    });
  }

  const spine = byTag(opf, "itemref").map(r => manifest[r.getAttribute("idref")]).filter(Boolean);
  const paras = [], chaps = [];
  for (let i = 0; i < spine.length; i++) {
    say(`Reading EPUB: part ${i + 1} of ${spine.length}…`);
    const s = await read(spine[i].path);
    if (!s) continue;
    const r = htmlToParas(s);
    if (!r.paras.length) continue;
    const t = toc.get(spine[i].path) || (!toc.size && r.heading);
    if (t) chaps.push({ title: t, para: paras.length });
    paras.push(...r.paras);
  }
  if (!paras.length) throw fail("No text was found in this book. It may be DRM-protected.");
  return { title, paras, chaps };
}

async function readFile(f) {
  if (!f) return;
  const kind = /\.pdf$/i.test(f.name) || f.type === "application/pdf" ? "pdf"
    : /\.epub$/i.test(f.name) || f.type === "application/epub+zip" ? "epub"
    : /\.txt$/i.test(f.name) || f.type === "text/plain" ? "txt" : null;
  if (!kind) { say(`The file "${f.name}" is not supported. Open a TXT, PDF or EPUB file.`); return; }
  if (playing) stop();
  const btns = [$("load")];
  btns.forEach(b => b.disabled = true);
  try {
    const buf = await f.arrayBuffer();
    let text, chaps = [], title = f.name;
    if (kind === "txt") text = decode(buf);
    else {
      const book = kind === "pdf" ? await pdfToBook(buf, f.name) : await epubToBook(buf, f.name);
      text = book.paras.join("\n\n"); chaps = book.chaps; title = book.title;
    }
    $("text").value = text;
    const saved = store.set("rsvp-text", text) && store.set("rsvp-chapters", JSON.stringify(chaps));
    if (!saved) { store.set("rsvp-text", ""); store.set("rsvp-chapters", "[]"); }
    store.set("rsvp-title", title);
    loadText(text, 0, chaps);
    say(`Opened "${title}": ${tokens.length.toLocaleString("en")} words` +
      (chapters.length > 1 ? `, ${chapters.length} chapters.` : ".") +
      (saved ? "" : " The book is too large to keep in the browser, so you will need to open it again after reloading the page."));
    $("stage").scrollIntoView({ behavior: "smooth", block: "center" });
  } catch (e) {
    say(e && e.friendly ? e.message : `Could not read "${f.name}". The file may be damaged or protected.`);
  } finally {
    btns.forEach(b => b.disabled = false);
    $("file").value = "";
  }
}
$("file").onchange = e => readFile(e.target.files[0]);
const src = $("source");
src.addEventListener("dragover", e => { e.preventDefault(); src.classList.add("drop"); });
src.addEventListener("dragleave", () => src.classList.remove("drop"));
src.addEventListener("drop", e => { e.preventDefault(); src.classList.remove("drop"); readFile(e.dataTransfer.files[0]); });

/* Init */
(function init() {
  const w = store.get("rsvp-wpm"); if (w) { $("wpm").value = w; $("wpmOut").textContent = w; }
  ["optRamp", "optPause", "optDim"].forEach(id => { const v = store.get("rsvp-" + id); if (v !== null) $(id).checked = v === "1"; });
  const saved = store.get("rsvp-text");
  const text = saved || SAMPLE;
  let chaps = [];
  try { chaps = saved ? JSON.parse(store.get("rsvp-chapters") || "[]") : []; } catch (e) {}
  $("text").value = text;
  if (saved) {
    const t = store.get("rsvp-title");
    say(t ? `"${t}": picking up where you left off.` : "Picking up where you left off.");
  }
  loadText(text, +(store.get("rsvp-pos") || 0), chaps);
})();
</script>
