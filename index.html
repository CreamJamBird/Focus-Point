<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focal Point · Точка фокуса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=IBM+Plex+Sans:wght@500&display=swap">
<style>
:root {
  --bg: #eef0ec; --surface: #f8f9f6; --line: #d3d8d0; --fg: #1b2230;
  --muted: #687080; --pivot: #cf3326; --accent: #23466e;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #12151b; --surface: #1a1e26; --line: #2c323d; --fg: #e3e6ea;
    --muted: #9098a6; --pivot: #ff6656; --accent: #8fb3e0; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  display: grid; place-items: center; padding: 16px;
}
main { display: flex; flex-direction: column; align-items: center; gap: 28px; text-align: center; }
h1 { margin: 0; font-family: "Literata", Georgia, serif; font-weight: 600; font-size: clamp(28px, 7vw, 44px); line-height: 1.25; }
h1 b { color: var(--pivot); font-weight: 600; }
h1 span { display: block; font-size: 0.55em; color: var(--muted); font-weight: 500; }
.langs { display: flex; gap: 14px; }
a {
  display: inline-flex; align-items: center; justify-content: center;
  width: 120px; height: 64px; border-radius: 12px; text-decoration: none;
  font-size: 22px; font-weight: 500; letter-spacing: 0.06em;
  color: var(--fg); background: var(--surface); border: 1px solid var(--line);
}
a:hover { border-color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
a.suggested { background: var(--accent); border-color: var(--accent); color: var(--surface); }
</style>
</head>
<body>
<main>
  <h1>F<b>o</b>cal Point<span>Точка ф<b>о</b>куса</span></h1>
  <nav class="langs" aria-label="Language / Язык">
    <a href="index.en.html" id="en" lang="en">EN</a>
    <a href="index.ru.html" id="ru" lang="ru">RU</a>
  </nav>
</main>
<script>
  // highlight the language the browser prefers
  const ru = /^(ru|uk|be|kk)/i.test(navigator.language || "");
  document.getElementById(ru ? "ru" : "en").classList.add("suggested");
</script>
</body>
</html>
